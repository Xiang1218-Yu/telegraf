# Gather information about systemd-unit states
# This plugin ONLY supports Linux
[[inputs.systemd_units]]
  ## Pattern of units to collect
  ## A space-separated list of unit-patterns including wildcards determining
  ## the units to collect.
  ##  ex: pattern = "telegraf* influxdb* user@*"
  # pattern = "*"

  ## Filter for a specific unit type
  ## Available settings are: service, socket, target, device, mount,
  ## automount, swap, timer, path, slice and scope
  # unittype = "service"

  ## Collect system or user scoped units
  ##  ex: scope = "user"
  # scope = "system"

  ## Collect also units not loaded by systemd (disabled or static units)
  ## Enabling this feature might introduce significant load when used with
  ## unspecific patterns (such as '*') as systemd will need to load all
  ## matching unit files.
  # collect_disabled_units = false

  ## Collect detailed information for the units
  # details = false

  ## Collect a dependency-aware health summary for each unit
  ## In addition to the regular unit metrics, emit a 'systemd_unit_health'
  ## metric per unit that summarizes its 'Requires' and 'Wants' dependencies
  ## as well as its reverse dependencies ('RequiredBy'/'WantedBy'). The
  ## summary distinguishes own failures, failed dependencies, missing
  ## dependencies and dependency cycles. If the dependency graph cannot be
  ## read completely, the unit is reported as 'incomplete' instead of being
  ## misjudged as healthy. The summary is rebuilt on every gather cycle and
  ## reflects dependency changes.
  # collect_dependency_health = false

  ## Timeout for state-collection
  # timeout = "5s"
